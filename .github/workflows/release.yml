# Release: push a version tag and this builds + publishes a GitHub Release.
#   git tag v0.2.1 && git push origin v0.2.1
# The version baked into PopBar.exe comes from the tag, so About / plugin pages always match the release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Small build: needs the .NET 10 Desktop Runtime on the target machine. ReadyToRun off: it adds ~14 MB for a
      # startup gain the user never notices in a tray app.
      - name: Publish (framework-dependent)
        run: >
          dotnet publish PopBar/PopBar.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:Version=${{ env.VERSION }} -o out/fd

      # Runs anywhere, no runtime install; bigger because it carries .NET + WPF.
      - name: Publish (self-contained)
        run: >
          dotnet publish PopBar/PopBar.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=false -p:Version=${{ env.VERSION }} -o out/sc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/fd/PopBar.exe "dist/PopBar-$env:VERSION-win-x64.exe"
          Compress-Archive -Path out/sc/PopBar.exe -DestinationPath "dist/PopBar-$env:VERSION-win-x64-standalone.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: softprops/action-gh-release@v2
        with:
          name: PopBar ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **下载哪个？**
            - `PopBar-${{ env.VERSION }}-win-x64.exe`：体积小，需要先安装 [.NET 10 桌面运行时](https://dotnet.microsoft.com/download/dotnet/10.0)（Windows Desktop Runtime x64）。
            - `PopBar-${{ env.VERSION }}-win-x64-standalone.zip`：解压即用，无需安装运行时，体积较大。

            需要 Windows 10 2004（19041）及以上。
          files: dist/*
